<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supabase Transport Isolation</title><style>body{font:16px system-ui;background:#101827;color:#eee;max-width:760px;margin:30px auto;padding:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#202b3b;padding:18px;border-radius:12px}button{font:inherit;padding:12px;border-radius:8px}small{color:#bbc}</style><h1>Supabase Transport Isolation</h1><p>Tests HTTPS reachability and a raw WebSocket handshake without Supabase SDK, wallet, Ledger Trail, or chat logic. Does not send messages or write data.</p><button id="run">Run checks</button><pre id="log" aria-live="polite"></pre><small>WebSocket close 1006 alone cannot reveal the HTTP handshake status. No credentials are printed.</small><script type="module">
const base='https://faenazefsogaoghuclis.supabase.co';const key='sb_publishable_8CRe36dcXHN_QV7dsVBMLg_xu6rw55M';const log=document.getElementById('log');let sock;const say=s=>{log.textContent+=new Date().toLocaleTimeString()+'  '+s+'\n'};
async function check(){log.textContent='';if(sock){try{sock.close()}catch{}}say('Browser WebSocket API: '+typeof WebSocket);say('Project host: '+new URL(base).host);const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),9000);try{const r=await fetch(base+'/auth/v1/health',{headers:{apikey:key},signal:ctrl.signal,cache:'no-store'});say('HTTPS Auth health: HTTP '+r.status); }catch(e){say('HTTPS Auth health: '+e.name+' '+e.message)}finally{clearTimeout(timer)}
const url=new URL(base.replace(/^http/,'ws')+'/realtime/v1/websocket');url.searchParams.set('apikey',key);url.searchParams.set('vsn','1.0.0');say('Raw WebSocket handshake starting (key hidden)');try{sock=new WebSocket(url);const t=setTimeout(()=>{if(sock.readyState!==WebSocket.OPEN){say('WebSocket: no open event after 10s');sock.close()}},10000);sock.onopen=()=>{clearTimeout(t);say('WebSocket: OPEN — handshake succeeded');sock.send(JSON.stringify({topic:'realtime:transport_probe',event:'phx_join',payload:{config:{broadcast:{self:false},presence:{enabled:false},postgres_changes:[],private:false}},ref:'1'}));say('Sent public-channel join probe')};sock.onmessage=e=>{try{const p=JSON.parse(e.data);say('Server reply: event='+p.event+' status='+(p.payload?.status??'n/a')+' response='+(p.payload?.response?.reason??'n/a'))}catch{say('Server sent non-JSON data')}};sock.onerror=()=>say('WebSocket: browser transport error (browser hides HTTP handshake response)');sock.onclose=e=>{clearTimeout(t);say('WebSocket: CLOSE code='+e.code+' clean='+e.wasClean+' reason='+(e.reason||'(none)'))}}catch(e){say('WebSocket constructor: '+e.name+' '+e.message)}}document.getElementById('run').onclick=check;check();
</script></html>
